<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto ODIN • Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --pink:    #da4895;
            --blue:    #257899;
            --bg:      #000;
            --surface: #080b0d;
            --text:    #e8e8e8;
            --muted:   #4a6070;
            --grad:    linear-gradient(135deg, var(--blue), var(--pink));
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ── Estrelas ─────────────────────────────────────── */
        .star {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: starIn 1s ease forwards,
                       twinkle var(--dur, 2s) infinite ease-in-out var(--tin, 1s);
            pointer-events: none;
            z-index: 0;
        }
        @keyframes starIn { to { opacity: var(--op, 0.5); } }
        @keyframes twinkle {
            0%, 100% { opacity: var(--op, 0.5); transform: scale(1); }
            50%       { opacity: calc(var(--op, 0.5) * 0.2); transform: scale(0.5); }
        }

        /* ── Glow ambiente ────────────────────────────────── */
        .ambient {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .ambient-pink {
            width: 400px; height: 300px;
            background: rgba(218,72,149,0.07);
            top: 20%; right: 10%;
            animation: float1 8s ease-in-out infinite;
        }
        .ambient-blue {
            width: 350px; height: 280px;
            background: rgba(37,120,153,0.07);
            bottom: 20%; left: 10%;
            animation: float2 10s ease-in-out infinite;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50%       { transform: translate(-20px, 20px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50%       { transform: translate(20px, -15px); }
        }

        /* ── Card de login ────────────────────────────────── */
        .login-card {
            position: relative;
            z-index: 10;
            width: 340px;
            animation: cardIn 0.9s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)     scale(1); }
        }

        /* ── Logo ─────────────────────────────────────────── */
        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
            animation: logoIn 0.9s 0.1s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes logoIn {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .logo-wrap img {
            width: 200px;
        }
        .logo-fallback {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Painel ───────────────────────────────────────── */
        .panel {
            background: rgba(6,9,11,0.95);
            border-radius: 20px;
            border: 1px solid rgba(37,120,153,0.25);
            box-shadow:
                0 0 0 1px rgba(218,72,149,0.08),
                0 30px 80px rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.04);
            padding: 32px 28px 28px;
        }

        .panel-eyebrow {
            text-align: center;
            font-family: 'Syne', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .panel-title {
            text-align: center;
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: white;
            margin-bottom: 28px;
            letter-spacing: -0.3px;
        }

        /* ── Campos ───────────────────────────────────────── */
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 7px;
            font-family: 'Syne', sans-serif;
        }
        .field-wrap {
            position: relative;
        }
        .field-icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            transition: color 0.2s ease;
        }
        .field input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(37,120,153,0.2);
            border-radius: 11px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 14.5px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .field input::placeholder { color: #334455; }
        .field input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37,120,153,0.15), 0 0 20px rgba(37,120,153,0.1);
        }
        .field input:focus ~ .field-icon,
        .field-wrap:focus-within .field-icon { color: var(--blue); }

        /* olho da senha */
        #toggle-pass {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            cursor: pointer;
            transition: color 0.2s ease;
            line-height: 0;
        }
        #toggle-pass:hover { color: var(--pink); }

        /* ── Mensagem de erro ─────────────────────────────── */
        #error-msg {
            display: none;
            align-items: center;
            gap: 7px;
            background: rgba(218,72,149,0.08);
            border: 1px solid rgba(218,72,149,0.3);
            border-radius: 9px;
            padding: 9px 12px;
            color: #e08ab8;
            font-size: 12.5px;
            margin-bottom: 14px;
            animation: shake 0.4s ease;
        }
        #error-msg.show { display: flex; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        /* ── Botão ────────────────────────────────────────── */
        #btn-login {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            border: none;
            border-radius: 11px;
            background: var(--grad);
            color: white;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: filter 0.2s ease, transform 0.15s ease;
        }
        #btn-login::after {
            content: "";
            position: absolute;
            top: -50%; left: -60%;
            width: 50%; height: 200%;
            background: rgba(255,255,255,0.15);
            transform: skewX(-20deg);
            transition: left 0.5s ease;
        }
        #btn-login:hover::after { left: 120%; }
        #btn-login:hover { filter: brightness(1.15); }
        #btn-login:active { filter: brightness(0.9); transform: scale(0.98); }
        #btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: none;
        }

        /* spinner dentro do botão */
        .btn-spinner {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        #btn-login.loading .btn-text { display: none; }
        #btn-login.loading .btn-spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Rodapé do card ───────────────────────────────── */
        .panel-footer {
            text-align: center;
            margin-top: 20px;
            color: #334455;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        /* ── Responsive ───────────────────────────────────── */
        @media (max-width: 400px) {
            .login-card { width: 90vw; }
        }
    </style>
</head>
<body>

    <div class="ambient ambient-pink"></div>
    <div class="ambient ambient-blue"></div>

    <div class="login-card">

        <div class="logo-wrap">
            <img src="PROJETO ODIN LOGO FINAL.png" alt="Projeto ODIN" id="logo-img"
                 onerror="this.style.display='none'; document.getElementById('logo-txt').style.display='block'">
            <span class="logo-fallback" id="logo-txt" style="display:none">PROJETO ODIN</span>
        </div>

        <div class="panel">
            <div class="panel-eyebrow">Área Restrita</div>
            <div class="panel-title">Seja bem-vindo</div>

            <div class="field">
                <label for="username">Usuário</label>
                <div class="field-wrap">
                    <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username" spellcheck="false">
                </div>
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <div class="field-wrap">
                    <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password">
                    <span id="toggle-pass" title="Mostrar/ocultar senha">
                        <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div id="error-msg">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span id="error-text">Usuário ou senha incorretos.</span>
            </div>

            <button id="btn-login">
                <span class="btn-text">Entrar</span>
                <div class="btn-spinner"></div>
            </button>

            <div class="panel-footer">Projeto ODIN © 2026 — Acesso restrito</div>
        </div>

    </div>

    <script>
    (() => {
        'use strict';

        /* ── Estrelas ─────────────────────────────────────── */
        function createStars(n = 260) {
            const frag = document.createDocumentFragment();
            const colors = ['#ffffff','#ffffff','#ffffff','#a8d8e8','#e8a8c8','#7ab8cc','#d87aaa'];
            for (let i = 0; i < n; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                const size = Math.random() * 2.2 + 0.4;
                const op   = (Math.random() * 0.45 + 0.15).toFixed(2);
                Object.assign(s.style, {
                    width:    `${size}px`,
                    height:   `${size}px`,
                    left:     `${Math.random() * 100}vw`,
                    top:      `${Math.random() * 100}vh`,
                    background: colors[Math.floor(Math.random() * colors.length)],
                    '--dur':  `${(Math.random() * 4 + 1.5).toFixed(2)}s`,
                    '--tin':  `${(Math.random() * 2 + 0.5).toFixed(2)}s`,
                    '--op':   op,
                    animationDelay: `${(Math.random() * 2).toFixed(2)}s`,
                });
                frag.appendChild(s);
            }
            document.body.appendChild(frag);
        }

        /* ── Elementos ────────────────────────────────────── */
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const btnLogin      = document.getElementById('btn-login');
        const errorMsg      = document.getElementById('error-msg');
        const errorText     = document.getElementById('error-text');
        const togglePass    = document.getElementById('toggle-pass');

        /* ── Mostrar/ocultar senha ────────────────────────── */
        togglePass.addEventListener('click', () => {
            const isPass = passwordInput.type === 'password';
            passwordInput.type = isPass ? 'text' : 'password';
            document.getElementById('eye-icon').innerHTML = isPass
                ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        });

        /* ── Limpa erro ao digitar ────────────────────────── */
        [usernameInput, passwordInput].forEach(el => {
            el.addEventListener('input', () => errorMsg.classList.remove('show'));
        });

        /* ── Enter nos campos ─────────────────────────────── */
        [usernameInput, passwordInput].forEach(el => {
            el.addEventListener('keydown', e => { if (e.key === 'Enter') tentarLogin(); });
        });

        /* ── Função de login ──────────────────────────────── */
        async function tentarLogin() {
            const usuario = usernameInput.value.trim();
            const senha   = passwordInput.value;

            if (!usuario || !senha) {
                mostrarErro('Preencha usuário e senha.');
                return;
            }

            // Estado de loading
            btnLogin.classList.add('loading');
            btnLogin.disabled = true;
            errorMsg.classList.remove('show');

            try {
                const res = await fetch('https://odin-backend-rv69.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usuario, password: senha })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Usuário ou senha incorretos.');
                localStorage.setItem('odin_token', data.token);
                window.location.href = '/projeto-ODIN/index.html';

            } catch (err) {
                mostrarErro(err.message || 'Erro ao conectar. Tente novamente.');
            } finally {
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
            }
        }

        function mostrarErro(msg) {
            errorText.textContent = msg;
            errorMsg.classList.remove('show');
            // força re-trigger da animação de shake
            void errorMsg.offsetWidth;
            errorMsg.classList.add('show');
            passwordInput.value = '';
            passwordInput.focus();
        }

        btnLogin.addEventListener('click', tentarLogin);

        /* ── Verifica se já está logado ───────────────────── */
        // Quando tiver o backend real, valide o token via API
        // Por ora, só checa se existe
        if (localStorage.getItem('odin_token')) {
            window.location.href = '/projeto-ODIN/index.html';
        }

        /* ── Init ─────────────────────────────────────────── */
        createStars();
        usernameInput.focus();

    })();
    </script>
</body>
</html>
