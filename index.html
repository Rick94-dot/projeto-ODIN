<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto ODIN • Busca IBGE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            position: relative;
        }

        /* Logo */
        .logo {
            position: absolute;
            top: 45px;
            width: 380px;
            z-index: 5;
        }

        /* Estrelas */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 2s infinite ease-in-out;
            z-index: -1;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.3; }
        }

        /* Barra de busca */
        #poda {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            min-width: 314px;
            max-width: 620px;
            height: 70px;
            z-index: 10;
            margin-top: 160px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Quando cidade é selecionada */
        #poda.city-selected {
            margin-top: 80px;
            opacity: 0.95;
        }

        .glow, .darkBorderBg, .white, .border {
            position: absolute;
            height: 100%;
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            z-index: -1;
        }

        .glow { filter: blur(30px); opacity: 0.4; }
        .glow::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(60deg); width: 999px; height: 999px; background-image: conic-gradient(#000, #402fb5 5%, #000 38%, #000 50%, #cf30aa 60%, #000 87%); transition: all 2s ease; }

        .darkBorderBg { max-height: 65px; max-width: 640px; }
        .darkBorderBg::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(82deg); width: 600px; height: 600px; background-image: conic-gradient(rgba(0,0,0,0), #18116a, rgba(0,0,0,0) 10%, rgba(0,0,0,0) 50%, #6e1b60, rgba(0,0,0,0) 60%); transition: all 2s ease; }

        .white { max-height: 63px; max-width: 635px; border-radius: 10px; filter: blur(2px); }
        .white::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(83deg); width: 600px; height: 600px; background-image: conic-gradient(rgba(0,0,0,0) 0%, #a099d8, rgba(0,0,0,0) 8%, rgba(0,0,0,0) 50%, #dfa2da, rgba(0,0,0,0) 58%); filter: brightness(1.4); transition: all 2s ease; }

        .border { max-height: 59px; max-width: 630px; border-radius: 11px; filter: blur(0.5px); }
        .border::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(70deg); width: 600px; height: 600px; background-image: conic-gradient(#1c191c, #402fb5 5%, #1c191c 14%, #1c191c 50%, #cf30aa 60%, #1c191c 64%); filter: brightness(1.3); transition: all 2s ease; }

        #main { position: relative; width: 100%; min-width: 301px; height: 56px; }

        .input {
            background-color: #010201;
            border: none;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            color: white;
            padding-left: 59px;
            padding-right: 55px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input::placeholder { color: #c0b9c0; }
        .input:focus { outline: none; }

        #input-mask, #pink-mask { pointer-events: none; position: absolute; }
        #input-mask { width: 100px; height: 20px; background: linear-gradient(90deg, transparent, #010201); top: 18px; left: 70px; z-index: 2; display: none; }
        #pink-mask { width: 30px; height: 20px; background: #cf30aa; top: 10px; left: 5px; filter: blur(20px); opacity: 0.8; transition: all 2s ease; z-index: 1; }

        #search-icon { position: absolute; left: 20px; top: 16px; z-index: 3; }

        #clear-btn {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #cf30aa;
            font-size: 22px;
            cursor: pointer;
            z-index: 4;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.2s ease;
        }
        #clear-btn.show { opacity: 1; }

        /* === PAINEL DE OPERADORAS (neon) === */
        #operator-panel {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 12px;
            width: 314px;
            background: rgba(10, 10, 11, 0.95);
            border-radius: 16px;
            border: 1px solid rgba(207, 48, 170, 0.4);
            box-shadow: 0 0 40px rgba(207, 48, 170, 0.5);
            padding: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 30;
            display: none;
        }

        #operator-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        #operator-panel .subtitle {
            text-align: center;
            color: #cf30aa;
            font-size: 15px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .operator-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(207, 48, 170, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .operator-item:hover {
            border-color: #cf30aa;
            background: rgba(207, 48, 170, 0.15);
            transform: translateX(4px);
        }

        .operator-item.selected {
            border-color: #cf30aa;
            background: rgba(207, 48, 170, 0.25);
            box-shadow: 0 0 20px rgba(207, 48, 170, 0.6);
        }

        .operator-item .checkmark {
            margin-left: auto;
            font-size: 20px;
            opacity: 0;
            transition: all 0.3s;
        }

        .operator-item.selected .checkmark {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .logo { width: 280px; top: 40px; }
            #poda { max-width: 90vw; }
            #operator-panel { width: 280px; }
        }
    </style>
</head>
<body>

    <img src="PROJETO ODIN LOGO FINAL.png" alt="Projeto ODIN" class="logo">

    <div id="poda">
        <div class="glow"></div>
        <div class="darkBorderBg"></div><div class="darkBorderBg"></div><div class="darkBorderBg"></div>
        <div class="white"></div>
        <div class="border"></div>

        <div id="main">
            <input type="text" class="input" placeholder="Digite cidade ou UF..." id="search-input">
            <div id="input-mask"></div>
            <div id="pink-mask"></div>

            <div id="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
                    <circle stroke="url(#search)" r="8" cy="11" cx="11"/>
                    <line stroke="url(#searchl)" y2="16.65" y1="22" x2="16.65" x1="22"/>
                    <defs>
                        <linearGradient gradientTransform="rotate(50)" id="search"><stop stop-color="#f8e7f8" offset="0%"/><stop stop-color="#b6a9b7" offset="50%"/></linearGradient>
                        <linearGradient id="searchl"><stop stop-color="#b6a9b7" offset="0%"/><stop stop-color="#837484" offset="50%"/></linearGradient>
                    </defs>
                </svg>
            </div>

            <div id="clear-btn">✕</div>
        </div>

        <div id="results"></div>
    </div>

    <!-- Novo painel de operadoras -->
    <div id="operator-panel">
        <div class="subtitle">selecione uma operadora</div>
        
        <div class="operator-item" data-operator="Metlife">
            Metlife <span class="checkmark">✓</span>
        </div>
        <div class="operator-item" data-operator="Unimed">
            Unimed <span class="checkmark">✓</span>
        </div>
        <div class="operator-item" data-operator="Odontoprev">
            Odontoprev <span class="checkmark">✓</span>
        </div>
        <div class="operator-item" data-operator="Hapvida">
            Hapvida <span class="checkmark">✓</span>
        </div>
    </div>

    <script>
        // Estrelas
        function createStars() {
            const numberOfStars = 350;
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDuration = `${Math.random() * 3 + 1}s`;
                document.body.appendChild(star);
            }
        }

        let municipios = [];
        let debounceTimer = null;
        let selectedCity = "";

        const IBGE_URL = "https://api.codetabs.com/v1/proxy?quest=https://servicodados.ibge.gov.br/api/v1/localidades/municipios?orderBy=nome";

        function removerAcentos(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        async function carregarMunicipios() {
            try {
                const response = await fetch(IBGE_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                municipios = data.map(m => {
                    let uf = '??';
                    if (m.microrregiao && m.microrregiao.mesorregiao && m.microrregiao.mesorregiao.UF) {
                        uf = m.microrregiao.mesorregiao.UF.sigla;
                    }
                    return { nome: m.nome, uf: uf, texto: `${m.nome}, ${uf}` };
                });
            } catch (error) { console.error(error); }
        }

        function filtrarCidades(termo) {
            const resultsContainer = document.getElementById('results');
            const input = document.getElementById('search-input');
           
            if (!termo || termo.length < 2) {
                resultsContainer.classList.remove('show');
                return;
            }

            const termoLower = termo.toLowerCase().trim();
            const termoSemAcento = removerAcentos(termoLower);

            const resultados = municipios.filter(m =>
                removerAcentos(m.nome.toLowerCase()).includes(termoSemAcento) || 
                m.uf.toLowerCase().includes(termoLower)
            ).slice(0, 15);

            if (resultados.length === 0) {
                resultsContainer.innerHTML = `<div class="no-results">Nenhuma cidade encontrada para "<strong>${termo}</strong>"</div>`;
            } else {
                resultsContainer.innerHTML = resultados.map(r => `
                    <div class="result-item" data-value="${r.texto}">
                        <span class="city">${r.nome}</span><span class="uf">${r.uf}</span>
                    </div>
                `).join('');
            }
            resultsContainer.classList.add('show');
        }

        function toggleClearButton() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-btn');
            const mask = document.getElementById('input-mask');

            if (input.value.trim().length > 0) {
                clearBtn.classList.add('show');
                mask.style.display = 'none';
            } else {
                clearBtn.classList.remove('show');
                mask.style.display = 'block';
            }
        }

        function selectCity(cityText) {
            const input = document.getElementById('search-input');
            const poda = document.getElementById('poda');
            const results = document.getElementById('results');
            const operatorPanel = document.getElementById('operator-panel');

            input.value = cityText;
            results.classList.remove('show');
            toggleClearButton();

            // Move a barra para cima e aplica transparência
            poda.classList.add('city-selected');

            // Mostra o painel de operadoras com fade
            operatorPanel.classList.add('show');
        }

        function debounce(func, delay) {
            return function(...args) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => func(...args), delay);
            };
        }

        window.onload = async function() {
            createStars();
            await carregarMunicipios();

            const input = document.getElementById('search-input');
            const resultsContainer = document.getElementById('results');
            const clearBtn = document.getElementById('clear-btn');
            const operatorPanel = document.getElementById('operator-panel');

            input.addEventListener('input', () => {
                filtrarCidades(input.value);
                toggleClearButton();
                // Esconde o painel de operadoras se o usuário voltar a digitar
                if (operatorPanel.classList.contains('show')) {
                    operatorPanel.classList.remove('show');
                    document.getElementById('poda').classList.remove('city-selected');
                }
            });

            // Clique em resultado da cidade
            resultsContainer.addEventListener('click', function(e) {
                if (e.target.closest('.result-item')) {
                    const item = e.target.closest('.result-item');
                    selectCity(item.getAttribute('data-value'));
                }
            });

            // Botão X
            clearBtn.addEventListener('click', () => {
                input.value = '';
                resultsContainer.classList.remove('show');
                operatorPanel.classList.remove('show');
                document.getElementById('poda').classList.remove('city-selected');
                toggleClearButton();
                input.focus();
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') resultsContainer.classList.remove('show');
            });

            document.addEventListener('click', function(e) {
                if (!document.getElementById('poda').contains(e.target)) {
                    resultsContainer.classList.remove('show');
                }
            });

            console.log('%c✅ Projeto ODIN - Painel de operadoras adicionado!', 'color: #cf30aa; font-weight: bold');
        };
    </script>
</body>
</html>
