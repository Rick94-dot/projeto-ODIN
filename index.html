<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto ODIN • Busca IBGE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root { --bg: #010201; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            position: relative;
        }

        /* === BACKGROUND ESTRELAS MELHORADO === */
        .star-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: transparent;
            z-index: -1;
            overflow: hidden;
        }

        .stars1 { animation: starMove 120s linear infinite; }
        .stars2 { animation: starMove 180s linear infinite; }
        .stars3 { animation: starMove 240s linear infinite; }

        @keyframes starMove {
            from { transform: translateY(0); }
            to   { transform: translateY(-2000px); }
        }

        /* Camada 1 - estrelas grandes */
        .stars1::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 200%;
            background: transparent;
            box-shadow: 
                120px 300px #fff, 450px 120px #fff, 780px 650px #fff,
                1100px 200px #fff, 1400px 800px #fff, 170px 1100px #fff,
                650px 1400px #fff, 920px 300px #fff, 1250px 900px #fff,
                300px 600px #fff, 1550px 400px #fff, 800px 1500px #fff,
                200px 200px #fff, 600px 800px #fff, 1000px 1100px #fff;
            animation: twinkle 4s infinite alternate;
        }

        /* Camada 2 - estrelas médias */
        .stars2::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 200%;
            background: transparent;
            box-shadow: 
                50px 150px #fff, 300px 400px #fff, 700px 100px #fff,
                950px 700px #fff, 1300px 250px #fff, 1600px 1200px #fff,
                250px 900px #fff, 850px 1400px #fff, 1150px 500px #fff,
                400px 200px #fff, 1400px 800px #fff, 600px 1100px #fff,
                100px 700px #fff, 1700px 300px #fff, 800px 1500px #fff;
            animation: twinkle 6s infinite alternate;
        }

        /* Camada 3 - estrelas pequenas */
        .stars3::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 200%;
            background: transparent;
            box-shadow: 
                20px 80px #fff, 180px 300px #fff, 420px 50px #fff,
                680px 520px #fff, 920px 180px #fff, 1250px 750px #fff,
                1500px 400px #fff, 100px 1100px #fff, 550px 1300px #fff,
                800px 250px #fff, 1100px 900px #fff, 1400px 1200px #fff,
                200px 600px #fff, 1700px 100px #fff, 300px 1400px #fff;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0%   { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Grid sutil */
        .grid {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(to right, rgba(15,15,16,0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15,15,16,0.3) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            pointer-events: none;
        }

        /* === BARRA NEON (igual antes) === */
        #poda {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 314px;
            height: 70px;
            z-index: 10;
        }

        .glow, .darkBorderBg, .white, .border {
            position: absolute;
            max-height: 70px; max-width: 314px;
            height: 100%; width: 100%;
            overflow: hidden; border-radius: 12px; z-index: -1;
        }

        .glow { filter: blur(30px); opacity: 0.4; max-height: 130px; max-width: 354px; }
        .glow::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(60deg); width: 999px; height: 999px; background-image: conic-gradient(#000, #402fb5 5%, #000 38%, #000 50%, #cf30aa 60%, #000 87%); transition: all 2s ease; }

        .darkBorderBg { max-height: 65px; max-width: 312px; }
        .darkBorderBg::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(82deg); width: 600px; height: 600px; background-image: conic-gradient(rgba(0,0,0,0), #18116a, rgba(0,0,0,0) 10%, rgba(0,0,0,0) 50%, #6e1b60, rgba(0,0,0,0) 60%); transition: all 2s ease; }

        .white { max-height: 63px; max-width: 307px; border-radius: 10px; filter: blur(2px); }
        .white::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(83deg); width: 600px; height: 600px; background-image: conic-gradient(rgba(0,0,0,0) 0%, #a099d8, rgba(0,0,0,0) 8%, rgba(0,0,0,0) 50%, #dfa2da, rgba(0,0,0,0) 58%); filter: brightness(1.4); transition: all 2s ease; }

        .border { max-height: 59px; max-width: 303px; border-radius: 11px; filter: blur(0.5px); }
        .border::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(70deg); width: 600px; height: 600px; background-image: conic-gradient(#1c191c, #402fb5 5%, #1c191c 14%, #1c191c 50%, #cf30aa 60%, #1c191c 64%); filter: brightness(1.3); transition: all 2s ease; }

        #main { position: relative; width: 301px; height: 56px; }
        .input {
            background-color: #010201; border: none; width: 100%; height: 100%;
            border-radius: 10px; color: white; padding-left: 59px; padding-right: 20px;
            font-size: 18px; font-weight: 500; letter-spacing: 0.3px;
        }
        .input::placeholder { color: #c0b9c0; }
        .input:focus { outline: none; }

        #input-mask, #pink-mask { pointer-events: none; position: absolute; }
        #input-mask { width: 100px; height: 20px; background: linear-gradient(90deg, transparent, #010201); top: 18px; left: 70px; z-index: 2; }
        #pink-mask { width: 30px; height: 20px; background: #cf30aa; top: 10px; left: 5px; filter: blur(20px); opacity: 0.8; transition: all 2s ease; z-index: 1; }

        #search-icon { position: absolute; left: 20px; top: 16px; z-index: 3; }

        #poda:hover .glow::before,
        #poda:hover .darkBorderBg::before,
        #poda:hover .white::before,
        #poda:hover .border::before { transform: translate(-50%, -50%) rotate(240deg); }

        #poda:focus-within .glow::before,
        #poda:focus-within .darkBorderBg::before,
        #poda:focus-within .white::before,
        #poda:focus-within .border::before { transform: translate(-50%, -50%) rotate(420deg); transition-duration: 4s; }

        #poda:hover #pink-mask { opacity: 0; }
        #main:focus-within #input-mask { display: none; }

        #results {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 8px;
            width: 314px;
            max-height: 380px;
            background: #0a0a0b;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            box-shadow: 0 0 30px rgba(207, 48, 170, 0.3);
            overflow-y: auto;
            z-index: 20;
            display: none;
            flex-direction: column;
            padding: 8px 0;
            scrollbar-width: thin;
        }
        #results.show { display: flex; }
        .result-item {
            padding: 12px 20px; color: #e0e0e0; font-size: 15.5px;
            cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .result-item:hover { background: rgba(207, 48, 170, 0.15); color: white; padding-left: 24px; }
        .result-item .city { font-weight: 600; }
        .result-item .uf { color: #cf30aa; font-size: 13px; margin-left: 8px; }
        .no-results { padding: 20px; text-align: center; color: #888; font-size: 14px; }

        @media (max-width: 480px) {
            #poda, #results { width: 280px; }
        }
    </style>
</head>
<body>
    <!-- Camadas de estrelas -->
    <div class="star-layer stars1"></div>
    <div class="star-layer stars2"></div>
    <div class="star-layer stars3"></div>

    <!-- Grid sutil -->
    <div class="grid"></div>

    <!-- Barra de busca -->
    <div id="poda">
        <div class="glow"></div>
        <div class="darkBorderBg"></div><div class="darkBorderBg"></div><div class="darkBorderBg"></div>
        <div class="white"></div>
        <div class="border"></div>

        <div id="main">
            <input type="text" class="input" placeholder="Digite cidade ou UF..." id="search-input">
            <div id="input-mask"></div>
            <div id="pink-mask"></div>

            <div id="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
                    <circle stroke="url(#search)" r="8" cy="11" cx="11"/>
                    <line stroke="url(#searchl)" y2="16.65" y1="22" x2="16.65" x1="22"/>
                    <defs>
                        <linearGradient gradientTransform="rotate(50)" id="search"><stop stop-color="#f8e7f8" offset="0%"/><stop stop-color="#b6a9b7" offset="50%"/></linearGradient>
                        <linearGradient id="searchl"><stop stop-color="#b6a9b7" offset="0%"/><stop stop-color="#837484" offset="50%"/></linearGradient>
                    </defs>
                </svg>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // (seu script de busca permanece igual)
        let municipios = [];
        let debounceTimer = null;

        const IBGE_URL = "https://api.codetabs.com/v1/proxy?quest=https://servicodados.ibge.gov.br/api/v1/localidades/municipios?orderBy=nome";

        function removerAcentos(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        async function carregarMunicipios() {
            try {
                const response = await fetch(IBGE_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                municipios = data.map(m => {
                    let uf = '??';
                    if (m.microrregiao && m.microrregiao.mesorregiao && m.microrregiao.mesorregiao.UF) {
                        uf = m.microrregiao.mesorregiao.UF.sigla;
                    }
                    return { nome: m.nome, uf: uf, texto: `${m.nome}, ${uf}` };
                });
            } catch (error) { console.error(error); }
        }

        function filtrarCidades(termo) {
            const resultsContainer = document.getElementById('results');
            const input = document.getElementById('search-input');
           
            if (!termo || termo.length < 2) {
                resultsContainer.classList.remove('show');
                return;
            }

            const termoLower = termo.toLowerCase().trim();
            const termoSemAcento = removerAcentos(termoLower);

            const resultados = municipios.filter(m =>
                removerAcentos(m.nome.toLowerCase()).includes(termoSemAcento) || 
                m.uf.toLowerCase().includes(termoLower)
            ).slice(0, 15);

            if (resultados.length === 0) {
                resultsContainer.innerHTML = `<div class="no-results">Nenhuma cidade encontrada para "<strong>${termo}</strong>"</div>`;
            } else {
                resultsContainer.innerHTML = resultados.map(r => `
                    <div class="result-item" data-value="${r.texto}">
                        <span class="city">${r.nome}</span><span class="uf">${r.uf}</span>
                    </div>
                `).join('');
            }
            resultsContainer.classList.add('show');
        }

        function debounce(func, delay) {
            return function(...args) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => func(...args), delay);
            };
        }

        window.onload = async function() {
            await carregarMunicipios();
            const input = document.getElementById('search-input');
            const resultsContainer = document.getElementById('results');
            
            input.addEventListener('input', debounce((e) => filtrarCidades(e.target.value), 250));
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') resultsContainer.classList.remove('show');
            });
            
            document.addEventListener('click', function(e) {
                if (!document.getElementById('poda').contains(e.target)) {
                    resultsContainer.classList.remove('show');
                }
            });
        };
    </script>
</body>
</html>
