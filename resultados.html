<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto ODIN • Resultados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --pink:   #da4895;
            --blue:   #257899;
            --bg:     #000;
            --surface:#080b0d;
            --border: #1a2428;
            --text:   #e8e8e8;
            --muted:  #4a6070;
            --grad:   linear-gradient(135deg, var(--blue), var(--pink));
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            overflow-x: hidden;
        }

        /* ── Estrelas ─────────────────────────────────────── */
        .star {
            position: fixed;
            border-radius: 50%;
            opacity: 0;
            animation: starIn 1s ease forwards, twinkle var(--dur,2s) infinite ease-in-out var(--tin,1s);
            pointer-events: none;
            z-index: 0;
        }
        @keyframes starIn { to { opacity: var(--op, 0.5); } }
        @keyframes twinkle {
            0%,100% { opacity: var(--op,0.5); }
            50%      { opacity: calc(var(--op,0.5)*0.2); }
        }

        /* ── Header ───────────────────────────────────────── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(37,120,153,0.2);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .logo-header {
            height: 38px;
            cursor: pointer;
        }
        .logo-fallback-header {
            font-family: 'Syne', sans-serif;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 4px;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Filtros resumo ───────────────────────────────── */
        .search-summary {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Syne', sans-serif;
            letter-spacing: 0.5px;
            border: 1px solid rgba(37,120,153,0.3);
            color: #7ab8cc;
            background: rgba(37,120,153,0.08);
        }
        .tag.pink {
            border-color: rgba(218,72,149,0.3);
            color: #e08ab8;
            background: rgba(218,72,149,0.08);
        }

        /* botão voltar */
        .btn-back {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-back:hover { border-color: var(--blue); color: #7ab8cc; }

        /* ── Main ─────────────────────────────────────────── */
        main {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        /* ── Contador ─────────────────────────────────────── */
        .results-header {
            margin-bottom: 24px;
            animation: fadeUp 0.5s ease both;
        }
        .results-count {
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .results-title {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: white;
        }

        /* ── Loading ──────────────────────────────────────── */
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
            gap: 20px;
        }
        .loader-ring {
            width: 52px; height: 52px;
            border: 3px solid rgba(37,120,153,0.2);
            border-top-color: var(--blue);
            border-right-color: var(--pink);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ── Cards ────────────────────────────────────────── */
        #cards-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px 22px;
            transition: border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
            animation: fadeUp 0.4s ease both;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--grad);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .card:hover {
            border-color: rgba(37,120,153,0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .card:hover::before { opacity: 1; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* card top */
        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .card-nome {
            font-family: 'Syne', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: white;
            line-height: 1.3;
        }
        .card-distancia {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--blue);
            background: rgba(37,120,153,0.1);
            border: 1px solid rgba(37,120,153,0.25);
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
            font-family: 'Syne', sans-serif;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        /* especialidades */
        .card-especialidades {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 14px;
        }
        .esp-tag {
            font-size: 10.5px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 5px;
            background: rgba(218,72,149,0.08);
            border: 1px solid rgba(218,72,149,0.2);
            color: #e08ab8;
            font-family: 'Syne', sans-serif;
            letter-spacing: 0.3px;
        }

        /* divider */
        .card-divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 14px;
        }

        /* card info row */
        .card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 500px) {
            .card-info { grid-template-columns: 1fr; }
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #8a9aaa;
        }
        .info-item svg { flex-shrink: 0; opacity: 0.7; }
        .info-item a {
            color: #8a9aaa;
            text-decoration: none;
            transition: color 0.15s ease;
        }
        .info-item a:hover { color: white; }

        .info-endereco {
            grid-column: 1 / -1;
        }

        /* card actions */
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .btn-tel {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(37,120,153,0.3);
            background: rgba(37,120,153,0.06);
            color: #7ab8cc;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-tel:hover { background: rgba(37,120,153,0.15); border-color: var(--blue); color: white; }

        .btn-wpp {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(37,180,80,0.3);
            background: rgba(37,180,80,0.06);
            color: #5dd98a;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-wpp:hover { background: rgba(37,180,80,0.15); border-color: #25b450; color: white; }

        .btn-detalhes {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-left: auto;
        }
        .btn-detalhes:hover { border-color: var(--pink); color: var(--pink); }

        /* ── Paginação ────────────────────────────────────── */
        #paginacao {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 40px;
        }
        .btn-pagina {
            padding: 10px 24px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-pagina:hover:not(:disabled) {
            border-color: var(--blue);
            color: #7ab8cc;
        }
        .btn-pagina:disabled { opacity: 0.3; cursor: not-allowed; }
        .pagina-info {
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        /* ── Sem resultados ───────────────────────────────── */
        #sem-resultados {
            display: none;
            text-align: center;
            padding: 80px 0;
        }
        #sem-resultados h3 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            color: white;
            margin-bottom: 8px;
        }
        #sem-resultados p { color: var(--muted); font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <img src="PROJETO ODIN LOGO FINAL.png" alt="ODIN" class="logo-header" id="logo-img"
             onclick="window.location.href='/projeto-ODIN/index.html'"
             onerror="this.style.display='none';document.getElementById('logo-txt').style.display='block'">
        <span class="logo-fallback-header" id="logo-txt" style="display:none" onclick="window.location.href='/projeto-ODIN/index.html'">ODIN</span>

        <div class="search-summary" id="search-summary"></div>

        <button class="btn-back" onclick="window.location.href='/projeto-ODIN/index.html'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Nova busca
        </button>
    </header>

    <main>
        <div class="results-header" id="results-header" style="display:none">
            <div class="results-count" id="results-count"></div>
            <div class="results-title" id="results-title"></div>
        </div>

        <div id="loading">
            <div class="loader-ring"></div>
            <div class="loader-text">Buscando dentistas...</div>
        </div>

        <div id="sem-resultados">
            <h3>Nenhum resultado encontrado</h3>
            <p>Tente buscar em outra cidade ou com outra especialidade.</p>
        </div>

        <div id="cards-grid"></div>

        <div id="paginacao" style="display:none">
            <button class="btn-pagina" id="btn-anterior" onclick="mudarPagina(-1)">← Anterior</button>
            <span class="pagina-info" id="pagina-info"></span>
            <button class="btn-pagina" id="btn-proximo" onclick="mudarPagina(1)">Próximo →</button>
        </div>
    </main>

    <script>
    (() => {
        'use strict';

        const API_URL = 'https://odin-backend-rv69.onrender.com';

        // ── Proteção de rota ───────────────────────────────
        if (!localStorage.getItem('odin_token')) {
            window.location.replace('/projeto-ODIN/login.html');
        }

        // ── Pega parâmetros da URL ─────────────────────────
        const params       = new URLSearchParams(window.location.search);
        const cidade       = params.get('cidade') || '';
        const operadora    = params.get('operadora') || '';
        const especialidade= params.get('especialidade') || '999';
        const espNome      = params.get('espNome') || 'Todas';

        let paginaAtual = 1;
        let totalDentistas = 0;
        const POR_PAGINA = 20;

        // ── Estrelas ───────────────────────────────────────
        function createStars() {
            const frag = document.createDocumentFragment();
            const colors = ['#fff','#fff','#a8d8e8','#e8a8c8'];
            for (let i = 0; i < 150; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                const size = Math.random() * 1.8 + 0.3;
                const op   = (Math.random() * 0.3 + 0.1).toFixed(2);
                Object.assign(s.style, {
                    width: `${size}px`, height: `${size}px`,
                    left: `${Math.random()*100}vw`,
                    top:  `${Math.random()*100}vh`,
                    background: colors[Math.floor(Math.random()*colors.length)],
                    '--dur': `${(Math.random()*4+1.5).toFixed(2)}s`,
                    '--tin': `${(Math.random()*2+0.5).toFixed(2)}s`,
                    '--op': op,
                    animationDelay: `${(Math.random()*2).toFixed(2)}s`,
                });
                frag.appendChild(s);
            }
            document.body.appendChild(frag);
        }

        // ── Resumo da busca no header ──────────────────────
        function renderSummary() {
            const summary = document.getElementById('search-summary');
            summary.innerHTML = `
                <span class="tag">📍 ${cidade}</span>
                <span class="tag pink">🏥 ${operadora}</span>
                <span class="tag">🦷 ${espNome}</span>
            `;
        }

        // ── Busca dentistas ────────────────────────────────
        async function buscar(pagina) {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('cards-grid').innerHTML = '';
            document.getElementById('paginacao').style.display = 'none';
            document.getElementById('results-header').style.display = 'none';
            document.getElementById('sem-resultados').style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/buscar/odontoprev`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cidade, codigoEspecialidade: especialidade, pagina: String(pagina) })
                });
                const data = await res.json();

                document.getElementById('loading').style.display = 'none';

                if (!data.dentistas || data.dentistas.length === 0) {
                    document.getElementById('sem-resultados').style.display = 'block';
                    return;
                }

                totalDentistas = parseInt(data.total) || 0;
                const totalPaginas = Math.ceil(totalDentistas / POR_PAGINA);

                // Header
                document.getElementById('results-count').textContent = `${totalDentistas} dentistas encontrados`;
                document.getElementById('results-title').textContent = `Resultados para ${cidade}`;
                document.getElementById('results-header').style.display = 'block';

                // Cards
                renderCards(data.dentistas);

                // Paginação
                if (totalPaginas > 1) {
                    document.getElementById('pagina-info').textContent = `Página ${pagina} de ${totalPaginas}`;
                    document.getElementById('btn-anterior').disabled = pagina <= 1;
                    document.getElementById('btn-proximo').disabled = pagina >= totalPaginas;
                    document.getElementById('paginacao').style.display = 'flex';
                }

            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('sem-resultados').style.display = 'block';
                console.error(err);
            }
        }

        // ── Render cards ───────────────────────────────────
        function renderCards(dentistas) {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';

            dentistas.forEach((d, i) => {
                const especialidades = d.especialidades
                    .split('|')
                    .map(e => e.trim())
                    .filter(Boolean)
                    .map(e => `<span class="esp-tag">${e}</span>`)
                    .join('');

                const telLink = d.telefone
                    ? `<a class="btn-tel" href="tel:${d.telefone.replace(/\s/g,'')}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.16 6.16l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        ${d.telefone}
                       </a>`
                    : '';

                const wppNum = d.whatsapp ? d.whatsapp.replace(/\D/g,'') : '';
                const wppLink = wppNum
                    ? `<a class="btn-wpp" href="https://wa.me/55${wppNum}" target="_blank">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
                        ${d.whatsapp}
                       </a>`
                    : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${i * 0.04}s`;
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-nome">${d.nome}</div>
                        <div class="card-distancia">📍 ${d.distancia.replace('à ','')}</div>
                    </div>
                    <div class="card-especialidades">${especialidades}</div>
                    <div class="card-divider"></div>
                    <div class="card-info">
                        <div class="info-item info-endereco">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            ${d.endereco}
                        </div>
                    </div>
                    <div class="card-actions">
                        ${telLink}
                        ${wppLink}
                        ${d.linkDetalhes ? `<a class="btn-detalhes" href="${d.linkDetalhes}" target="_blank">Ver detalhes →</a>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ── Paginação ──────────────────────────────────────
        function mudarPagina(delta) {
            paginaAtual += delta;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            buscar(paginaAtual);
        }
        window.mudarPagina = mudarPagina;

        // ── Init ───────────────────────────────────────────
        createStars();
        renderSummary();

        if (!cidade || !operadora) {
            window.location.replace('/projeto-ODIN/index.html');
        } else {
            buscar(1);
        }

    })();
    </script>
</body>
</html>
