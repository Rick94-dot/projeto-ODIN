<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto ODIN • Resultados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --pink:    #da4895;
            --blue:    #257899;
            --green:   #22c55e;
            --bg:      #000;
            --surface: #080b0d;
            --border:  #1a2428;
            --text:    #e8e8e8;
            --muted:   #4a6070;
            --grad:    linear-gradient(135deg, var(--blue), var(--pink));
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            overflow-x: hidden;
        }

        /* ── Estrelas ─────────────────────────────────────── */
        .star {
            position: fixed;
            border-radius: 50%;
            opacity: 0;
            animation: starIn 1s ease forwards, twinkle var(--dur,2s) infinite ease-in-out var(--tin,1s);
            pointer-events: none;
            z-index: 0;
        }
        @keyframes starIn { to { opacity: var(--op,0.4); } }
        @keyframes twinkle {
            0%,100% { opacity: var(--op,0.4); }
            50%      { opacity: calc(var(--op,0.4)*0.15); }
        }

        /* ── Header ───────────────────────────────────────── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(37,120,153,0.15);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .logo-header { height: 30px; cursor: pointer; flex-shrink: 0; }
        .logo-fallback-header {
            font-family: 'Syne', sans-serif;
            font-size: 14px; font-weight: 800; letter-spacing: 4px;
            background: var(--grad);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            flex-shrink: 0;
        }
        .header-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

        .search-summary {
            display: flex; align-items: center; gap: 5px;
            flex-wrap: wrap; flex: 1; min-width: 0;
        }
        .tag {
            padding: 3px 9px; border-radius: 20px;
            font-size: 10px; font-weight: 600; font-family: 'Syne', sans-serif; letter-spacing: 0.3px;
            border: 1px solid rgba(37,120,153,0.25); color: #7ab8cc; background: rgba(37,120,153,0.06);
            white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis;
        }
        .tag.pink { border-color: rgba(218,72,149,0.25); color: #e08ab8; background: rgba(218,72,149,0.06); }

        .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto; }

        .btn-excel {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: 8px;
            border: 1px solid rgba(34,197,94,0.35); background: rgba(34,197,94,0.07); color: #4ade80;
            font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        .btn-excel:hover { background: rgba(34,197,94,0.14); border-color: var(--green); color: white; }
        .btn-excel:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-back {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: 8px;
            border: 1px solid var(--border); background: transparent; color: var(--muted);
            font-family: 'DM Sans', sans-serif; font-size: 13px;
            cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        .btn-back:hover { border-color: var(--blue); color: #7ab8cc; }

        /* ── Main ─────────────────────────────────────────── */
        main {
            position: relative; z-index: 1;
            max-width: 960px; margin: 0 auto; padding: 28px 20px 80px;
        }

        /* ── Results header ───────────────────────────────── */
        .results-header {
            display: flex; align-items: flex-end; justify-content: space-between;
            margin-bottom: 20px;
            animation: fadeUp 0.5s ease both;
            gap: 12px; flex-wrap: wrap;
        }
        .results-count {
            font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 3px;
        }
        .results-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: white; }
        .results-page-info { font-size: 12px; color: var(--muted); font-family: 'Syne', sans-serif; letter-spacing: 0.5px; }

        /* ── Loading ──────────────────────────────────────── */
        #loading {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 100px 0; gap: 20px;
        }
        .loader-ring {
            width: 48px; height: 48px;
            border: 2.5px solid rgba(37,120,153,0.15);
            border-top-color: var(--blue); border-right-color: var(--pink);
            border-radius: 50%; animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            font-family: 'Syne', sans-serif; font-size: 11px;
            letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted);
        }

        /* ── Cards grid ───────────────────────────────────── */
        #cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 640px) { #cards-grid { grid-template-columns: 1fr; } }

        /* ── Card ─────────────────────────────────────────── */
        .card {
            background: var(--surface); border-radius: 14px; border: 1px solid var(--border);
            padding: 18px 18px 14px;
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeUp 0.4s ease both;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; gap: 10px;
        }
        .card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: var(--grad); opacity: 0; transition: opacity 0.2s ease;
        }
        .card:hover { border-color: rgba(37,120,153,0.35); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
        .card:hover::before { opacity: 1; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-num {
            position: absolute; top: 14px; right: 14px;
            font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700;
            color: var(--border); letter-spacing: 0.5px;
        }
        .card-nome {
            font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
            color: white; line-height: 1.3; padding-right: 28px;
        }
        .card-dist {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 10.5px; font-weight: 600; color: var(--blue);
            background: rgba(37,120,153,0.1); border: 1px solid rgba(37,120,153,0.2);
            padding: 2px 8px; border-radius: 20px;
            font-family: 'Syne', sans-serif; width: fit-content;
        }
        .card-esps { display: flex; flex-wrap: wrap; gap: 4px; }
        .esp-tag {
            font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
            background: rgba(218,72,149,0.07); border: 1px solid rgba(218,72,149,0.18);
            color: #d87aaa; font-family: 'Syne', sans-serif; white-space: nowrap;
        }
        .card-info { display: flex; flex-direction: column; gap: 5px; }
        .info-row {
            display: flex; align-items: flex-start; gap: 7px;
            font-size: 12px; color: #7a8a98; line-height: 1.4;
        }
        .info-row svg { flex-shrink: 0; margin-top: 1px; opacity: 0.5; }

        .card-actions {
            display: flex; gap: 6px; flex-wrap: wrap;
            margin-top: auto; padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .btn-tel, .btn-wpp, .btn-ver {
            display: flex; align-items: center; gap: 5px;
            padding: 6px 11px; border-radius: 7px;
            font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
            cursor: pointer; text-decoration: none; transition: all 0.18s ease; white-space: nowrap;
        }
        .btn-tel { border: 1px solid rgba(37,120,153,0.25); background: rgba(37,120,153,0.05); color: #7ab8cc; }
        .btn-tel:hover { background: rgba(37,120,153,0.14); color: white; border-color: var(--blue); }
        .btn-wpp { border: 1px solid rgba(34,197,94,0.25); background: rgba(34,197,94,0.05); color: #4ade80; }
        .btn-wpp:hover { background: rgba(34,197,94,0.12); color: white; border-color: var(--green); }
        .btn-ver { border: 1px solid var(--border); background: transparent; color: var(--muted); margin-left: auto; }
        .btn-ver:hover { border-color: var(--pink); color: var(--pink); }

        /* ── Sem resultados ───────────────────────────────── */
        #sem-resultados { display: none; text-align: center; padding: 100px 0; }
        #sem-resultados .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
        #sem-resultados h3 { font-family: 'Syne', sans-serif; font-size: 18px; color: white; margin-bottom: 8px; }
        #sem-resultados p { color: var(--muted); font-size: 14px; }

        /* ── Paginação ────────────────────────────────────── */
        #paginacao { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 40px; }
        .btn-pagina {
            padding: 9px 20px; border-radius: 9px;
            border: 1px solid var(--border); background: var(--surface); color: var(--muted);
            font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-pagina:hover:not(:disabled) { border-color: var(--blue); color: #7ab8cc; }
        .btn-pagina:disabled { opacity: 0.3; cursor: not-allowed; }
        .pagina-info { font-family: 'Syne', sans-serif; font-size: 11px; color: var(--muted); min-width: 100px; text-align: center; }

        /* ── Toast ────────────────────────────────────────── */
        #toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.4); color: #4ade80;
            padding: 11px 20px; border-radius: 10px;
            font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
            z-index: 999; transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease;
            opacity: 0; white-space: nowrap;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ── Feedback Widget ──────────────────────────────── */
        #feedback-widget {
            position: fixed; top: 70px; right: 20px;
            z-index: 1000; display: flex; flex-direction: column;
            align-items: flex-end; gap: 6px;
        }
        #feedback-toggle {
            display: flex; align-items: center; gap: 7px;
            height: 38px; padding: 0 14px 0 10px;
            border-radius: 20px; border: 1px solid rgba(218,72,149,0.35);
            background: rgba(6,9,11,0.92); color: #e08ab8;
            font-family: 'Syne', sans-serif; font-size: 11px;
            font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            cursor: pointer; backdrop-filter: blur(12px); white-space: nowrap;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #feedback-toggle:hover { border-color: var(--pink); box-shadow: 0 0 16px rgba(218,72,149,0.2); }
        #feedback-toggle:active { transform: scale(0.96); }
        .fb-sub-btns {
            display: flex; flex-direction: column; align-items: flex-end;
            gap: 5px; overflow: hidden; max-height: 0; opacity: 0;
            transition: max-height 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease;
        }
        .fb-sub-btns.open { max-height: 120px; opacity: 1; }
        .fb-sub-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: 20px;
            border: 1px solid var(--border); background: rgba(6,9,11,0.92); color: #8a9aaa;
            font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            backdrop-filter: blur(12px); white-space: nowrap; transition: all 0.2s ease;
        }
        .fb-sub-btn:hover { border-color: var(--pink); color: var(--pink); background: rgba(218,72,149,0.06); }

        /* Modal */
        .fb-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .fb-overlay.open { opacity: 1; pointer-events: all; }
        .fb-modal {
            background: rgba(8,11,13,0.98); border: 1px solid rgba(37,120,153,0.3);
            border-radius: 18px; padding: 28px 26px; width: 340px; max-width: 90vw;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            transform: translateY(20px) scale(0.97);
            transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
        }
        .fb-overlay.open .fb-modal { transform: translateY(0) scale(1); }
        .fb-modal-title {
            font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700;
            letter-spacing: 2.5px; text-transform: uppercase;
            background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .fb-modal-subtitle { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; color: white; margin-bottom: 20px; }
        .star-wrap { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; margin-bottom: 16px; }
        .star-wrap input { display: none; }
        .star-wrap label { font-size: 32px; color: #2a3540; cursor: pointer; transition: color 0.2s; }
        .star-wrap label:hover, .star-wrap label:hover ~ label, .star-wrap input:checked ~ label { color: var(--pink); }
        .fb-textarea {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            border-radius: 10px; color: white; font-family: 'DM Sans', sans-serif;
            font-size: 13.5px; padding: 11px 14px; resize: none; outline: none; margin-bottom: 14px;
            transition: border-color 0.2s ease;
        }
        .fb-textarea:focus { border-color: var(--blue); }
        .fb-textarea::placeholder { color: var(--muted); }
        .fb-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .fb-cancel { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
        .fb-cancel:hover { border-color: var(--pink); color: var(--pink); }
        .fb-send { padding: 9px 18px; border-radius: 8px; border: none; background: var(--grad); color: white; font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: filter 0.2s; }
        .fb-send:hover { filter: brightness(1.15); }

        /* ── Responsivo ───────────────────────────────────── */
        @media (max-width: 768px) {
            header { padding: 10px 14px; gap: 8px; flex-wrap: wrap; }
            .header-divider { display: none; }
            .search-summary { order: 3; width: 100%; }
            .header-actions { margin-left: 0; }
            .btn-back span { display: none; }
            #cards-grid { grid-template-columns: 1fr; }
            main { padding: 20px 14px 60px; }
            .results-title { font-size: 16px; }
        }

        @media (max-width: 480px) {
            .btn-excel span { display: none; }
            #feedback-widget { top: auto; bottom: 20px; right: 16px; }
            .tag { max-width: 120px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="PROJETO ODIN LOGO FINAL.png" alt="ODIN" class="logo-header" id="logo-img"
             onclick="window.location.href='/index.html'"
             onerror="this.style.display='none';document.getElementById('logo-txt').style.display='block'">
        <span class="logo-fallback-header" id="logo-txt" style="display:none"
              onclick="window.location.href='/index.html'">ODIN</span>
        <div class="header-divider"></div>
        <div class="search-summary" id="search-summary"></div>
        <div class="header-actions">
            <button class="btn-excel" id="btn-excel" onclick="exportarExcel()" disabled>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="12" y1="18" x2="12" y2="12"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
                <span>Exportar Excel</span>
            </button>
            <button class="btn-back" onclick="window.location.href='/index.html'">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Nova busca
            </button>
        </div>
    </header>

    <main>
        <div class="results-header" id="results-header" style="display:none">
            <div>
                <div class="results-count" id="results-count"></div>
                <div class="results-title" id="results-title"></div>
            </div>
            <div class="results-page-info" id="results-page-info"></div>
        </div>

        <div id="loading">
            <div class="loader-ring"></div>
            <div class="loader-text">Buscando prestadores...</div>
        </div>

        <div id="sem-resultados">
            <div class="icon">🔍</div>
            <h3>Nenhum resultado encontrado</h3>
            <p>Tente buscar em outra cidade ou com outra especialidade.</p>
        </div>

        <div id="cards-grid"></div>

        <div id="paginacao" style="display:none"></div>
    </main>

    <div id="toast">✓ Excel exportado com sucesso!</div>

    <!-- ── Feedback Widget ─────────────────────────────── -->
    <div id="feedback-widget">
        <button id="feedback-toggle" onclick="toggleFeedback()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Feedback
        </button>
        <div class="fb-sub-btns" id="fb-sub-btns">
            <button class="fb-sub-btn" onclick="abrirModal('avaliar')">⭐ Avaliar</button>
            <button class="fb-sub-btn" onclick="abrirModal('melhoria')">💡 Melhoria</button>
        </div>
    </div>

    <!-- Modal Avaliar -->
    <div class="fb-overlay" id="modal-avaliar">
        <div class="fb-modal">
            <div class="fb-modal-title">Feedback</div>
            <div class="fb-modal-subtitle">Como você avalia o ODIN?</div>
            <div class="star-wrap">
                <input type="radio" id="r5" name="rating" value="5"><label for="r5">★</label>
                <input type="radio" id="r4" name="rating" value="4"><label for="r4">★</label>
                <input type="radio" id="r3" name="rating" value="3"><label for="r3">★</label>
                <input type="radio" id="r2" name="rating" value="2"><label for="r2">★</label>
                <input type="radio" id="r1" name="rating" value="1"><label for="r1">★</label>
            </div>
            <textarea class="fb-textarea" id="avaliar-texto" placeholder="Conte o que achou (opcional)..." style="height:90px"></textarea>
            <div class="fb-actions">
                <button class="fb-cancel" onclick="fecharModal('avaliar')">Cancelar</button>
                <button class="fb-send" onclick="enviarFeedback('avaliar')">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Modal Melhoria -->
    <div class="fb-overlay" id="modal-melhoria">
        <div class="fb-modal">
            <div class="fb-modal-title">Feedback</div>
            <div class="fb-modal-subtitle">Qual melhoria você sugere?</div>
            <textarea class="fb-textarea" id="melhoria-texto" placeholder="Descreva a melhoria que você gostaria de ver..." style="height:120px"></textarea>
            <div class="fb-actions">
                <button class="fb-cancel" onclick="fecharModal('melhoria')">Cancelar</button>
                <button class="fb-send" onclick="enviarFeedback('melhoria')">Enviar</button>
            </div>
        </div>
    </div>

    <script>
    function toggleFeedback() {
        document.getElementById('fb-sub-btns').classList.toggle('open');
    }
    function abrirModal(tipo) {
        document.getElementById('fb-sub-btns').classList.remove('open');
        document.getElementById(`modal-${tipo}`).classList.add('open');
    }
    function fecharModal(tipo) {
        document.getElementById(`modal-${tipo}`).classList.remove('open');
    }
    function enviarFeedback(tipo) {
        if (tipo === 'avaliar') {
            const nota  = document.querySelector('input[name="rating"]:checked')?.value;
            const texto = document.getElementById('avaliar-texto').value.trim();
            if (!nota) { alert('Selecione uma nota antes de enviar!'); return; }
            fetch('https://odin-backend-rv69.onrender.com/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tipo: 'avaliacao', nota: Number(nota), texto, pagina: 'resultados' })
            });
        } else {
            const texto = document.getElementById('melhoria-texto').value.trim();
            if (!texto) { alert('Descreva a melhoria antes de enviar!'); return; }
            fetch('https://odin-backend-rv69.onrender.com/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tipo: 'melhoria', texto, pagina: 'resultados' })
            });
        }
        fecharModal(tipo);
        document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = false);
        document.getElementById('avaliar-texto').value = '';
        document.getElementById('melhoria-texto').value = '';
        const t = document.createElement('div');
        t.textContent = '✓ Feedback enviado! Obrigado 🙏';
        Object.assign(t.style, { position:'fixed', bottom:'28px', left:'50%', transform:'translateX(-50%)', background:'rgba(37,120,153,0.15)', border:'1px solid rgba(37,120,153,0.4)', color:'#7ab8cc', padding:'11px 20px', borderRadius:'10px', fontFamily:"'Syne',sans-serif", fontSize:'12px', fontWeight:'700', zIndex:'9999', whiteSpace:'nowrap', transition:'opacity 0.3s ease' });
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 3000);
    }
    document.querySelectorAll('.fb-overlay').forEach(el => {
        el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
    });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
    (() => {
        'use strict';

        const API_URL = 'https://odin-backend-rv69.onrender.com';

        if (!localStorage.getItem('odin_token')) {
            window.location.replace('/login.html');
        }

        const params        = new URLSearchParams(window.location.search);
        const cidade        = params.get('cidade')        || '';
        const operadora     = params.get('operadora')     || '';
        const especialidade = params.get('especialidade') || '999';
        const espNome       = params.get('espNome')       || 'Todas';
        const lat           = params.get('lat')           || '-23.519516199999998';
        const lng           = params.get('lng')           || '-46.8366591';

        const ROTAS = {
            'Odontoprev': { buscar: '/buscar/odontoprev', exportar: '/exportar/odontoprev' },
            'Unimed':     { buscar: '/buscar/unimed',     exportar: '/exportar/unimed' },
            'Metlife':    { buscar: '/buscar/metlife',    exportar: '/exportar/metlife' },
            'Hapvida':    { buscar: '/buscar/hapvida',    exportar: '/exportar/hapvida' },
        };
        const rota = ROTAS[operadora] || ROTAS['Odontoprev'];
        let totalDentistas = 0;

        /* ── Estrelas ─────────────────────────────────────── */
        function createStars() {
            const frag = document.createDocumentFragment();
            const colors = ['#fff','#fff','#a8d8e8','#e8a8c8'];
            for (let i = 0; i < 120; i++) {
                const s  = document.createElement('div');
                s.className = 'star';
                const sz = Math.random() * 1.6 + 0.3;
                const op = (Math.random() * 0.3 + 0.1).toFixed(2);
                Object.assign(s.style, {
                    width: `${sz}px`, height: `${sz}px`,
                    left: `${Math.random()*100}vw`, top: `${Math.random()*100}vh`,
                    background: colors[Math.floor(Math.random()*colors.length)],
                    '--dur': `${(Math.random()*4+1.5).toFixed(2)}s`,
                    '--tin': `${(Math.random()*2+0.5).toFixed(2)}s`,
                    '--op':  op,
                    animationDelay: `${(Math.random()*2).toFixed(2)}s`,
                });
                frag.appendChild(s);
            }
            document.body.appendChild(frag);
        }

        /* ── Summary ──────────────────────────────────────── */
        function renderSummary() {
            document.getElementById('search-summary').innerHTML = `
                <span class="tag">📍 ${cidade}</span>
                <span class="tag pink">🏥 ${operadora}</span>
                <span class="tag">🦷 ${espNome}</span>
            `;
        }

        /* ── Busca ────────────────────────────────────────── */
        async function buscar() {
            document.getElementById('loading').style.display        = 'flex';
            document.getElementById('cards-grid').innerHTML         = '';
            document.getElementById('paginacao').style.display      = 'none';
            document.getElementById('results-header').style.display = 'none';
            document.getElementById('sem-resultados').style.display = 'none';
            document.getElementById('btn-excel').disabled           = true;

            try {
                const res  = await fetch(`${API_URL}${rota.buscar}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cidade, codigoEspecialidade: especialidade, latitude: lat, longitude: lng })
                });
                const data = await res.json();
                document.getElementById('loading').style.display = 'none';

                if (!data.dentistas || data.dentistas.length === 0) {
                    document.getElementById('sem-resultados').style.display = 'block';
                    return;
                }

                totalDentistas = data.dentistas.length;

                document.getElementById('results-count').textContent    = `${totalDentistas} prestadores encontrados`;
                document.getElementById('results-title').textContent    = `${cidade} — ${espNome}`;
                document.getElementById('results-page-info').textContent = '';
                document.getElementById('results-header').style.display = 'block';
                document.getElementById('btn-excel').disabled           = false;

                renderCards(data.dentistas);

            } catch (err) {
                document.getElementById('loading').style.display        = 'none';
                document.getElementById('sem-resultados').style.display = 'block';
                console.error(err);
            }
        }

        /* ── Render cards ─────────────────────────────────── */
        function renderCards(dentistas) {
            const grid   = document.getElementById('cards-grid');
            grid.innerHTML = '';

            dentistas.forEach((d, i) => {
                const esps = d.especialidades
                    .split('|').map(e => e.trim()).filter(Boolean)
                    .map(e => `<span class="esp-tag">${e}</span>`).join('');

                const telLink = d.telefone
                    ? `<a class="btn-tel" href="tel:${d.telefone.replace(/\s/g,'')}">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.16 6.16l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        ${d.telefone}</a>` : '';

                const wppNum  = d.whatsapp ? d.whatsapp.replace(/\D/g,'') : '';
                const wppLink = wppNum
                    ? `<a class="btn-wpp" href="https://wa.me/55${wppNum}" target="_blank">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
                        ${d.whatsapp}</a>` : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${i * 0.035}s`;
                card.innerHTML = `
                    <span class="card-num">#${i + 1}</span>
                    <div class="card-nome">${d.nome}</div>
                    <div class="card-dist">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        ${d.distancia ? d.distancia.replace('à ','') : 'N/D'}
                    </div>
                    <div class="card-esps">${esps}</div>
                    <div class="card-info">
                        ${d.cro ? `<div class="info-row">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8L2 7h20z"/></svg>
                            CRO: ${d.cro}
                        </div>` : ''}
                        ${d.cnpj ? `<div class="info-row">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            CNPJ: ${d.cnpj}
                        </div>` : ''}
                        <div class="info-row">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            ${d.endereco}
                        </div>
                        ${d.email ? `<div class="info-row">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            ${d.email}
                        </div>` : ''}
                    </div>
                    <div class="card-actions">
                        ${telLink}
                        ${wppLink}
                        ${d.linkDetalhes ? `<a class="btn-ver" href="${d.linkDetalhes}" target="_blank">Ver detalhes →</a>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        /* ── Exportar Excel ───────────────────────────────── */
        window.exportarExcel = async function() {
            const btn = document.getElementById('btn-excel');
            btn.disabled = true;
            btn.innerHTML = `
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
                    <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
                    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
                </svg>
                <span>Buscando todos...</span>
            `;

            try {
                const res  = await fetch(`${API_URL}${rota.exportar}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cidade, codigoEspecialidade: especialidade, latitude: lat, longitude: lng })
                });
                const data = await res.json();

                if (!data.dentistas || data.dentistas.length === 0) {
                    alert('Nenhum dado para exportar.');
                    return;
                }

                const linhas = data.dentistas.map((d, i) => ({
                    '#':              i + 1,
                    'Nome':           d.nome,
                    'CRO':            d.cro || '',
                    'CNPJ':           d.cnpj || '',
                    'Especialidades': d.especialidades.replace(/\|/g, '/').trim(),
                    'Telefone':       d.telefone || '',
                    'WhatsApp':       d.whatsapp || '',
                    'Email':          d.email || '',
                    'Endereço':       d.endereco,
                    'Distância':      d.distancia ? d.distancia.replace('à ','') : '',
                    'Link Detalhes':  d.linkDetalhes || '',
                }));

                const ws = XLSX.utils.json_to_sheet(linhas);
                const wb = XLSX.utils.book_new();
                ws['!cols'] = [
                    { wch: 5 }, { wch: 35 }, { wch: 10 }, { wch: 18 },
                    { wch: 30 }, { wch: 16 }, { wch: 16 }, { wch: 30 },
                    { wch: 45 }, { wch: 12 }, { wch: 60 },
                ];
                XLSX.utils.book_append_sheet(wb, ws, 'Prestadores');

                const dataHoje = new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
                const arquivo  = `ODIN_${cidade.replace(/ /g,'_')}_${espNome.replace(/ /g,'_')}_${dataHoje}.xlsx`;
                XLSX.writeFile(wb, arquivo);

                const toast = document.getElementById('toast');
                toast.textContent = `✓ ${data.dentistas.length} prestadores exportados!`;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3500);

            } catch (err) {
                console.error(err);
                alert('Erro ao exportar. Tente novamente.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                    <span>Exportar Excel</span>
                `;
            }
        };

        /* ── Init ─────────────────────────────────────────── */
        createStars();
        renderSummary();
        if (!cidade || !operadora) {
            window.location.replace('/index.html');
        } else {
            buscar();
        }

    })();
    </script>
</body>
</html>
